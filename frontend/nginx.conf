server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy same-origin hacia el orchestrator para que cualquier dispositivo
    # en la red del colegio (celular de un alumno, por ejemplo) pueda usar
    # la app sin depender de "localhost", que solo resuelve en la propia maquina.
    location /api/ {
        proxy_pass http://orchestrator:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 150s;
    }
}
